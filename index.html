<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>행동 추천 프로그램 키</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        /* 버튼 스타일 꾸미기 */
        #startBtn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #2E4E3F;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin: 300px auto;
        }
        #startBtn:hover {
            background-color: #8DC73F;
        }
    </style>
</head>
<body>

<button id="startBtn" onclick="startMap()"><font color="white">지도 보기</font></button>

<div id="map" style="width:700px; height:700px; margin: 0 auto; display:none;"></div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=키 자리임!!"></script>

<script>
    var map;

    function startMap() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('map').style.display = 'block';

        var mapContainer = document.getElementById('map');
        var mapOption = {
            center: new kakao.maps.LatLng(37.293901, 126.974851),
            level: 4
        };
        map = new kakao.maps.Map(mapContainer, mapOption);

        var Myimgsrc = 'https://cdn-icons-png.flaticon.com/512/5988/5988611.png';
        var Myimgsize = new kakao.maps.Size(50,50);
        var MyimgOption = {offset: new kakao.maps.Point(25,25)}; // 마커 중심점 조정

        var Myimg = new kakao.maps.MarkerImage(Myimgsrc, Myimgsize, MyimgOption);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;

                var locPosition = new kakao.maps.LatLng(lat, lng);

                displayMy(locPosition, Myimg);
            });
        } else {
            var locPosition = new kakao.maps.LatLng(37.293901, 126.974851);
            displayMy(locPosition, Myimg);
        }

        loadCSV();
    }

    function displayMy(locPosition, markerImage) {
        var marker = new kakao.maps.Marker({
            position: locPosition,
            image: markerImage
        });
        marker.setMap(map);

        map.setCenter(locPosition);
    }

    function loadCSV() {
        Papa.parse("data.csv", {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                var data = results.data;
                console.log("CSV 데이터:", data);

                data.forEach(function(item) {
                    if(!item.lat || !item.lng) return;

                    var markerPosition = new kakao.maps.LatLng(item.lat, item.lng);
                    var marker = new kakao.maps.Marker({
                        position: markerPosition
                    });
                    marker.setMap(map);

                    if (item.name) {
                        var content = '<div style="padding:5px;">' + item.name  + '</div>';
                        var infowindow = new kakao.maps.InfoWindow({
                            content: content
                        });

                        kakao.maps.event.addListener(marker, 'mouseover', function() {
                            infowindow.open(map, marker);
                        });
                        kakao.maps.event.addListener(marker, 'mouseout', function() {
                            infowindow.close();
                        });
                    }
                });
            }
        });
    }
</script>
</body>
</html>
