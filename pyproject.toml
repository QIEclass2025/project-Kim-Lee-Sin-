[project]
name = "project-Kim-Lee-Sin"
version = "0.1.0"
description = "A simple activity recommender application."
requires-python = ">=3.8"
dependencies = [
    "requests>=2.32.4",
    "selenium>=4.27.1",
    "webdriver-manager>=4.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
